<main class="auth-page">
  <a class="wordmark" routerLink="/explore">indie film</a>

  <section class="auth-card fade-enter">
    <div class="mode-switch">
      <button
        type="button"
        [class.active]="mode() === 'login'"
        (click)="setMode('login')"
      >
        Entrar
      </button>

      <button
        type="button"
        [class.active]="mode() === 'register'"
        (click)="setMode('register')"
      >
        Crear cuenta
      </button>
    </div>

    @if (mode() === 'login') {
    <div class="auth-heading">
      <h1>Volvé a mirar.</h1>
      <p>Entrá para publicar, guardar likes y administrar tu portfolio.</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="submitLogin()">
      <label>
        <span>Email</span>

        <input
          type="email"
          formControlName="email"
          autocomplete="email"
          [attr.aria-invalid]="
              loginForm.controls.email.touched &&
              loginForm.controls.email.invalid
            "
        />

        @if (loginFieldError('email'); as message) {
        <small class="field-error">{{ message }}</small>
        }
      </label>

      <label>
        <span>Contraseña</span>

        <input
          type="password"
          formControlName="password"
          autocomplete="current-password"
          [attr.aria-invalid]="
              loginForm.controls.password.touched &&
              loginForm.controls.password.invalid
            "
        />

        @if (loginFieldError('password'); as message) {
        <small class="field-error">{{ message }}</small>
        }
      </label>

      <button class="submit-button" type="submit" [disabled]="submitting()">
        {{ submitting() ? 'Entrando…' : 'Entrar' }}
      </button>
    </form>
    } @else {
    <div class="auth-heading">
      <h1>Tu trabajo, en un lugar.</h1>
      <p>
        Creá tu perfil y empezá a construir el portfolio de tus producciones.
      </p>
    </div>

    <form [formGroup]="registerForm" (ngSubmit)="submitRegister()">
      <label>
        <span>Nombre</span>

        <input
          type="text"
          formControlName="displayName"
          autocomplete="name"
          [attr.aria-invalid]="
              registerForm.controls.displayName.touched &&
              registerForm.controls.displayName.invalid
            "
        />

        @if (registerFieldError('displayName'); as message) {
        <small class="field-error">{{ message }}</small>
        }
      </label>

      <label>
        <span>Usuario</span>

        <input
          type="text"
          formControlName="username"
          autocomplete="username"
          [attr.aria-invalid]="
              registerForm.controls.username.touched &&
              registerForm.controls.username.invalid
            "
        />

        @if (registerFieldError('username'); as message) {
        <small class="field-error">{{ message }}</small>
        }
      </label>

      <label>
        <span>Email</span>

        <input
          type="email"
          formControlName="email"
          autocomplete="email"
          [attr.aria-invalid]="
              registerForm.controls.email.touched &&
              registerForm.controls.email.invalid
            "
        />

        @if (registerFieldError('email'); as message) {
        <small class="field-error">{{ message }}</small>
        }
      </label>

      <label>
        <span>Fecha de nacimiento</span>

        <input
          type="date"
          formControlName="birthDate"
          autocomplete="bday"
          [max]="today"
          [attr.aria-invalid]="
              registerForm.controls.birthDate.touched &&
              registerForm.controls.birthDate.invalid
            "
        />

        @if (registerFieldError('birthDate'); as message) {
        <small class="field-error">{{ message }}</small>
        }
      </label>

      <label>
        <span>Contraseña</span>

        <input
          type="password"
          formControlName="password"
          autocomplete="new-password"
          [attr.aria-invalid]="
              registerForm.controls.password.touched &&
              registerForm.controls.password.invalid
            "
        />

        @if (registerFieldError('password'); as message) {
        <small class="field-error">{{ message }}</small>
        }
      </label>

      <button class="submit-button" type="submit" [disabled]="submitting()">
        {{ submitting() ? 'Creando…' : 'Crear cuenta' }}
      </button>
    </form>
    } @if (error()) {
    <p class="form-error">{{ error() }}</p>
    }
  </section>
</main>
