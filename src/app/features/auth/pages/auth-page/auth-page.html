<main class="auth-page">
  <a class="wordmark" routerLink="/explore">indie film</a>

  <section class="auth-card fade-enter">
    <div class="mode-switch">
      <button type="button" [class.active]="mode() === 'login'" (click)="setMode('login')">Entrar</button>
      <button type="button" [class.active]="mode() === 'register'" (click)="setMode('register')">Crear cuenta</button>
    </div>

    @if (mode() === 'login') {
      <div class="auth-heading">
        <h1>Volvé a mirar.</h1>
        <p>Entrá para publicar, guardar likes y administrar tu portfolio.</p>
      </div>

      <form [formGroup]="loginForm" (ngSubmit)="submitLogin()">
        <label>
          <span>Email</span>
          <input type="email" formControlName="email" autocomplete="email" />
        </label>
        <label>
          <span>Contraseña</span>
          <input type="password" formControlName="password" autocomplete="current-password" />
        </label>
        <button class="submit-button" type="submit" [disabled]="submitting()">
          {{ submitting() ? 'Entrando…' : 'Entrar' }}
        </button>
      </form>
    } @else {
      <div class="auth-heading">
        <h1>Tu trabajo, en un lugar.</h1>
        <p>Creá tu perfil y empezá a construir el portfolio de tus producciones.</p>
      </div>

      <form [formGroup]="registerForm" (ngSubmit)="submitRegister()">
        <label>
          <span>Nombre</span>
          <input type="text" formControlName="displayName" autocomplete="name" />
        </label>
        <label>
          <span>Usuario</span>
          <input type="text" formControlName="username" autocomplete="username" />
        </label>
        <label>
          <span>Email</span>
          <input type="email" formControlName="email" autocomplete="email" />
        </label>
        <label>
          <span>Contraseña</span>
          <input type="password" formControlName="password" autocomplete="new-password" />
        </label>
        <button class="submit-button" type="submit" [disabled]="submitting()">
          {{ submitting() ? 'Creando…' : 'Crear cuenta' }}
        </button>
      </form>
    }

    @if (error()) {
      <p class="form-error">{{ error() }}</p>
    }
  </section>
</main>
