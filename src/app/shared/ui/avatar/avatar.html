<div class="avatar" [attr.aria-label]="name()">
  @if (imageUrl() && !imageFailed()) {
    <img
      [src]="imageUrl()"
      [alt]="name()"
      [style.object-position]="objectPosition()"
      (error)="imageFailed.set(true)"
    />
  } @else {
    <span aria-hidden="true">{{ initials() }}</span>
  }
</div>
